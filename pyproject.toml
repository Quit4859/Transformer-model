[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmodel"
version = "0.1.0"
description = "Advanced decoder-only transformer + agent harness for coding agents"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
train = [
    "datasets>=3.0",
    "tokenizers>=0.20",
    "safetensors>=0.4",
]
serve = [
    "triton>=3.0",
]

[project.scripts]
agentmodel = "agentmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
