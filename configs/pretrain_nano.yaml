extends: base.yaml

model:
  vocab_size: 1024
  n_layer: 6
  d_model: 128
  n_head: 8
  n_kv_head: 2
  d_ff: 344
  max_seq_len: 1024
  partial_rope_dim: 16
  local_window: 256
  layer_pattern: swa
  tie_embeddings: false
  mtp_n_layer: 0

data:
  sequence_length: 1024
  eos_token_id: 2
  bos_token_id: 1
  pad_token_id: 0

optim:
  lr: 3.0e-3
  muon_lr: 0.02
  warmup_steps: 50
  decay_steps: 5000

train:
  micro_batch_size: 4
  grad_accum_steps: 2
  gradient_checkpointing: false
